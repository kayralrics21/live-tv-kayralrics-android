name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then
            echo "Android SDK not found" >&2
            exit 1
          fi
          SDK_MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDK_MANAGER" || ! -x "$SDK_MANAGER" ]]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-tv-kayralrics-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
